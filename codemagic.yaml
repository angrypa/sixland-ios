workflows:
  ios-ipa:
    name: 六岛 iOS（未签名 ipa）
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      vars:
        IOS_ZIP_URL: https://github.com/angrypa/sixland-ios/releases/download/v1.0.0/sixland_ios_xcode.zip
    triggering:
      events: []
    scripts:
      - name: 取 Xcode 工程
        script: |
          set -e
          echo "=== $(date '+%H:%M:%S') 下载 ==="
          curl -L --fail --connect-timeout 30 --max-time 900 --retry 3 --retry-delay 5 \
            "$IOS_ZIP_URL" -o ios.zip
          ls -lh ios.zip
          echo "=== $(date '+%H:%M:%S') 解压（反斜杠规范化）==="
          python3 - <<'PY'
          import os, re, shutil, zipfile
          shutil.rmtree('ios', ignore_errors=True)
          os.makedirs('ios', exist_ok=True)
          count = 0
          with zipfile.ZipFile('ios.zip') as z:
              for info in z.infolist():
                  name = info.filename.replace('\\', '/')
                  name = re.sub(r'^(\./|/)+', '', name)
                  if not name or name == '.':
                      continue
                  target = os.path.join('ios', name)
                  if name.endswith('/'):
                      os.makedirs(target, exist_ok=True)
                      continue
                  os.makedirs(os.path.dirname(target) or 'ios', exist_ok=True)
                  with z.open(info) as src, open(target, 'wb') as dst:
                      shutil.copyfileobj(src, dst)
                  count += 1
          print('extracted files:', count)
          PY
          find ios -name "*.sh" -exec chmod +x {} + 2>/dev/null || true
          PROJ=$(find ios -maxdepth 4 -name "Unity-iPhone.xcodeproj" | head -1)
          echo "xcodeproj=$PROJ"
          [ -n "$PROJ" ] || { echo "没找到 Unity-iPhone.xcodeproj（解压后的目录结构不对）"; ls -la ios | head -20; exit 3; }
      - name: 打未签名 ipa
        script: |
          set -e
          PROJ=$(find ios -maxdepth 4 -name "Unity-iPhone.xcodeproj" | head -1)
          DIR=$(dirname "$PROJ")
          OUT="$CM_BUILD_DIR/build"
          mkdir -p "$OUT"; cd "$DIR"
          xcodebuild -version
          echo "=== $(date '+%H:%M:%S') 开始 archive（最慢，20~40 分钟属正常）==="
          xcodebuild -quiet -project Unity-iPhone.xcodeproj -scheme Unity-iPhone \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -archivePath "$OUT/Unity-iPhone.xcarchive" archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" CODE_SIGN_ENTITLEMENTS="" \
            || { echo "xcodebuild archive 失败（看上面输出的 error）"; exit 5; }
          echo "=== $(date '+%H:%M:%S') archive 完成 ==="
          APPDIR="$OUT/Unity-iPhone.xcarchive/Products/Applications"
          ls -la "$APPDIR" || true
          APP=$(find "$APPDIR" -maxdepth 1 -name "*.app" | head -1)
          echo "app=$APP"
          [ -n "$APP" ] || { echo "archive 的 Products/Applications 里没有任何 .app"; exit 4; }
          mkdir -p "$OUT/Payload"
          cp -R "$APP" "$OUT/Payload/"
          cd "$OUT" && zip -qry sixland-unsigned.ipa Payload && rm -rf Payload
          ls -lh "$OUT/sixland-unsigned.ipa"
          echo "=== $(date '+%H:%M:%S') 全部完成 ==="
    artifacts:
      - build/sixland-unsigned.ipa
